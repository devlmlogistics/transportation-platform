services:
  platform:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-8080}:${PORT:-8080}"
    environment:
      APP_ENV: development
      PORT: ${PORT:-8080}
      LISTEN_HOST: ${LISTEN_HOST:-0.0.0.0}
      WEB_DIR: /app/web/dist
    restart: "no"
